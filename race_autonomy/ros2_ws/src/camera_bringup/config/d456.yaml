/camera/camera:
  ros__parameters:
    serial_no: "338122302896"
    enable_color: true
    rgb_camera.color_profile: "640x480x60"
    rgb_camera.color_format: "RGB8"
    rgb_camera.enable_auto_exposure: true
    color_qos: "SENSOR_DATA"
    # Color gain remains automatic under auto exposure. Wrapper 4.58.1 has no
    # separate rgb_camera.enable_auto_gain launch parameter.
    # Production mode: depth/infra/pointcloud/align/sync/rgbd are all disabled.
    # RGB plus the low-bandwidth motion streams are opened; unused video
    # streams remain off to preserve USB and host CPU headroom.
    enable_depth: false
    enable_infra: false
    enable_infra1: false
    enable_infra2: false
    # Production D456 motion streams. HID/IIO udev access is installed and
    # standalone hardware validation receives gyro at 200 Hz and accel at
    # 100 Hz. Keep these enabled for imu_manager and mount calibration.
    enable_gyro: true
    gyro_fps: 200
    gyro_qos: "SENSOR_DATA"
    enable_accel: true
    accel_fps: 100
    accel_qos: "SENSOR_DATA"
    enable_motion: false
    unite_imu_method: 0
    pointcloud.enable: false
    align_depth.enable: false
    enable_sync: false
    enable_rgbd: false
    publish_tf: false
    wait_for_device_timeout: 10.0
